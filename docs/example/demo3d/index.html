<title>ShapoGFX demo3d</title>
<link rel="stylesheet" href="../style.css">
<style>
  #screen { cursor: grab; }
  #screen:active { cursor: grabbing; }
</style>

<body>
<h1>ShapoGFX demo3d (software 3D renderer for embedded systems, running in WebAssembly)</h1>
<canvas id="screen"></canvas>
<div id="fps"></div>
<div class="help">
  Drag / arrow keys: rotate camera &nbsp;|&nbsp; Wheel / PageUp, PageDown: zoom
</div>
<div id="status">Loading...</div>
<div class="help">
  <a href="../demo2d/">demo2d</a> &nbsp;|&nbsp;
  <a href="../demorig/">demorig</a> &nbsp;|&nbsp;
  <a href="https://github.com/shapoco/shapo-gfx">github.com/shapoco/shapo-gfx</a>
</div>
<script src="../viewer.js"></script>
<script>
  // Camera limits match example/wasm/demo3d/scene.hpp
  startDemoViewer({
    wasm: 'demo3d.wasm',
    prefix: 'demo3d',
    camera: { yaw: 0.6, pitch: 0.35, dist: 7.0, pitchMin: -0.2, pitchMax: 1.4, distMin: 3.0, distMax: 20.0 },
  });
</script>
