name: Publish Docs

# Builds the site and deploys it to GitHub Pages as an artifact, so no
# generated HTML is ever committed to the repository. The site is:
#   docs/**        hand-written pages and the demo WASM builds (committed)
#   ref/           the Sphinx manual, built here from docsrc/
#
# Requires Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - docsrc/**
      - requirements.txt
      - .github/workflows/publish-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r docs/. _site/
          # The manual is generated here; drop any copy that is still committed
          rm -rf _site/ref
          # -d keeps Sphinx's internal cache out of the published output
          sphinx-build -b html -W --keep-going -d docsrc/_build/doctrees docsrc _site/ref

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
